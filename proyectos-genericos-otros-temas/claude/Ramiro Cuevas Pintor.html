 width=\"26\" height=\"182\" fill=\"#dde4ea\"><\u002Frect>\n<path d=\"M150 192 v-52 a24 24 0 0 1 48 0 v52Z\" fill=\"{{shutter}}\"><\u002Fpath>\n<rect x=\"28\" y=\"84\" width=\"22\" height=\"44\" fill=\"{{shutter}}\"><\u002Frect><rect x=\"52\" y=\"84\" width=\"20\" height=\"44\" fill=\"#2f4a63\"><\u002Frect><rect x=\"74\" y=\"84\" width=\"22\" height=\"44\" fill=\"{{shutter}}\"><\u002Frect>\n<rect x=\"272\" y=\"40\" width=\"20\" height=\"46\" fill=\"{{shutter}}\"><\u002Frect><rect x=\"294\" y=\"40\" width=\"20\" height=\"46\" fill=\"#2f4a63\"><\u002Frect><rect x=\"316\" y=\"40\" width=\"20\" height=\"46\" fill=\"{{shutter}}\"><\u002Frect>\n<rect x=\"272\" y=\"112\" width=\"20\" height=\"46\" fill=\"{{shutter}}\"><\u002Frect><rect x=\"294\" y=\"112\" width=\"20\" height=\"46\" fill=\"#2f4a63\"><\u002Frect><rect x=\"316\" y=\"112\" width=\"20\" height=\"46\" fill=\"{{shutter}}\"><\u002Frect>\n<path d=\"M0 40 h250 M250 0 h140\" stroke=\"#cdd6dd\" stroke-width=\"3\"><\u002Fpath>\n<circle cx=\"236\" cy=\"54\" r=\"16\" fill=\"#c2357a\"><\u002Fcircle><circle cx=\"250\" cy=\"70\" r=\"14\" fill=\"#d9478e\"><\u002Fcircle><circle cx=\"228\" cy=\"76\" r=\"12\" fill=\"#a92a69\"><\u002Fcircle><circle cx=\"244\" cy=\"96\" r=\"10\" fill=\"#c2357a\"><\u002Fcircle>\n<path d=\"M-60 192 L-20 40 M-36 192 L4 40\" stroke=\"#b07a36\" stroke-width=\"5\"><\u002Fpath>\n<path d=\"M-55 170 h24 M-49 146 h24 M-43 122 h24 M-37 98 h24 M-31 74 h24 M-25 50 h24\" stroke=\"#b07a36\" stroke-width=\"4\"><\u002Fpath>\n<rect x=\"-104\" y=\"166\" width=\"30\" height=\"26\" rx=\"3\" fill=\"{{shutter}}\"><\u002Frect><rect x=\"-104\" y=\"166\" width=\"30\" height=\"6\" fill=\"#ffffff\" opacity=\"0.5\"><\u002Frect>\n<\u002Fg>\n<g fill=\"#3d5a2e\"><circle cx=\"700\" cy=\"350\" r=\"34\"><\u002Fcircle><circle cx=\"740\" cy=\"336\" r=\"40\"><\u002Fcircle><circle cx=\"778\" cy=\"356\" r=\"28\"><\u002Fcircle><\u002Fg>\n<rect x=\"734\" y=\"370\" width=\"8\" height=\"40\" fill=\"#6b4a2a\"><\u002Frect>\n<g fill=\"#4a6a35\"><circle cx=\"1330\" cy=\"330\" r=\"30\"><\u002Fcircle><circle cx=\"1364\" cy=\"316\" r=\"36\"><\u002Fcircle><\u002Fg>\n<rect x=\"1356\" y=\"340\" width=\"8\" height=\"40\" fill=\"#6b4a2a\"><\u002Frect>\n<\u002Fsvg>\n<div style=\"position: absolute; left: max(5vw, 16px); bottom: 24px; right: max(5vw, 16px); max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #ffffff; color: #14212e; border-radius: 16px; padding: 12px 16px; width: fit-content\">\n<span style=\"font-weight: 700; font-size: 15px; margin-right: 4px\">Prueba un color para las contraventanas:<\u002Fspan>\n<sc-for list=\"{{swatches}}\" as=\"sw\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{sw.pick}}\" aria-label=\"{{sw.name}}\" aria-pressed=\"{{sw.on}}\" title=\"{{sw.name}}\" style=\"{{sw.style}}\"><\u002Fbutton>\n<\u002Fsc-for>\n<span style=\"font-size: 14px; color: #3c4b59\">{{shutterName}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section id=\"servicios\" style=\"padding: clamp(48px, 6vw, 96px) max(5vw, 16px)\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<h2 style=\"margin: 0; font-weight: 900; font-size: clamp(32px, 4vw, 48px); line-height: 1.05; letter-spacing: -0.02em\">Qué pinto<\u002Fh2>\n<p style=\"margin: 12px 0 36px; font-size: 18px; max-width: 40em; color: #3c4b59\">De una habitación a la casa entera, por dentro y por fuera. Cada trabajo empieza con una visita para ver el estado de las paredes y darte un precio claro.<\u002Fp>\n<div class=\"g3\">\n<sc-for list=\"{{services}}\" as=\"s\" hint-placeholder-count=\"6\">\n<div style=\"background: #eef5fc; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1b5fa6\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{s.icon}}\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 800; line-height: 1.2\">{{s.title}}<\u002Fh3>\n<p style=\"margin: 0; color: #3c4b59\">{{s.text}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #e8b33a; padding: clamp(40px, 5vw, 80px) max(5vw, 16px)\">\n<div class=\"g2\" style=\"max-width: 1240px; margin: 0 auto; align-items: center\">\n<h2 style=\"margin: 0; font-weight: 900; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.05; letter-spacing: -0.02em\">Pintura pensada para la costa<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 14px; font-size: 17px\">\n<p style=\"margin: 0\">En Jávea y Dénia el salitre, la humedad y el sol de verano castigan las fachadas y el hierro más que en el interior.<\u002Fp>\n<p style=\"margin: 0\">Por eso preparo bien la superficie antes de pintar: limpio, saneo grietas y desconchones, trato el óxido de rejas y barandillas, y uso pinturas de exterior adecuadas para zonas costeras.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"zona\" style=\"padding: clamp(48px, 6vw, 96px) max(5vw, 16px)\">\n<div class=\"g2\" style=\"max-width: 1240px; margin: 0 auto; align-items: start\">\n<div>\n<h2 style=\"margin: 0; font-weight: 900; font-size: clamp(32px, 4vw, 48px); line-height: 1.05; letter-spacing: -0.02em\">Dónde trabajo<\u002Fh2>\n<p style=\"margin: 12px 0 0; font-size: 18px; color: #3c4b59\">Base en Jávea y Dénia, a los dos lados del Montgó. También me desplazo a los pueblos cercanos de la Marina Alta; si tu casa está en otro sitio, pregúntame.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; gap: 14px; flex-wrap: wrap\">\n<span style=\"background: #1b5fa6; color: #ffffff; font-weight: 900; font-size: clamp(26px, 3vw, 36px); padding: 10px 22px; border-radius: 14px\">Jávea · Xàbia<\u002Fspan>\n<span style=\"background: #1b5fa6; color: #ffffff; font-weight: 900; font-size: clamp(26px, 3vw, 36px); padding: 10px 22px; border-radius: 14px\">Dénia<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n<sc-for list=\"{{towns}}\" as=\"t\" hint-placeholder-count=\"7\">\n<span style=\"border: 2px solid #1b5fa6; color: #123f70; font-weight: 600; padding: 8px 16px; border-radius: 999px\">{{t}}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"como-trabajo\" style=\"background: #eef5fc; padding: clamp(48px, 6vw, 96px) max(5vw, 16px)\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<h2 style=\"margin: 0 0 36px; font-weight: 900; font-size: clamp(32px, 4vw, 48px); line-height: 1.05; letter-spacing: -0.02em\">Cómo trabajo<\u002Fh2>\n<div class=\"g4\">\n<sc-for list=\"{{steps}}\" as=\"st\" hint-placeholder-count=\"4\">\n<div style=\"background: #ffffff; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<span style=\"width: 44px; height: 44px; border-radius: 50%; background: #1b5fa6; color: #ffffff; font-weight: 900; font-size: 20px; display: flex; align-items: center; justify-content: center\">{{st.n}}<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2\">{{st.title}}<\u002Fh3>\n<p style=\"margin: 0; color: #3c4b59\">{{st.text}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contacto\" style=\"background: #1b5fa6; color: #ffffff; padding: clamp(48px, 6vw, 96px) max(5vw, 16px)\">\n<div class=\"g2\" style=\"max-width: 1240px; margin: 0 auto; align-items: start\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-weight: 900; font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.02em\">Pide tu presupuesto sin compromiso<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; color: #e3eefa\">Cuéntame qué quieres pintar y te llamo para concertar una visita.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 18px; margin-top: 8px\">\n<div style=\"display: flex; gap: 12px; align-items: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#e8b33a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z\"><\u002Fpath><\u002Fsvg><span style=\"font-weight: 700\">[TELÉFONO / WHATSAPP]<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#e8b33a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"m22 7-10 6L2 7\"><\u002Fpath><\u002Fsvg><span style=\"font-weight: 700\">[CORREO ELECTRÓNICO]<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#e8b33a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>[HORARIO DE ATENCIÓN]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<form sc-camel-on-submit=\"{{submit}}\" style=\"background: #ffffff; color: #14212e; border-radius: 20px; padding: clamp(20px, 3vw, 32px); display: flex; flex-direction: column; gap: 16px\">\n<sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"background: #eef5fc; border-radius: 12px; padding: 16px; font-weight: 600\">Gracias. Ramiro te contactará para concertar la visita.<\u002Fdiv>\n<\u002Fsc-if>\n<label for=\"f-nombre\" style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600\">Nombre<input id=\"f-nombre\" name=\"nombre\" type=\"text\" autocomplete=\"name\" style=\"border: 1.5px solid #9aa9b7; border-radius: 10px; padding: 12px; min-height: 48px\"><\u002Flabel>\n<label for=\"f-tel\" style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600\">Teléfono<input id=\"f-tel\" name=\"telefono\" type=\"tel\" autocomplete=\"tel\" style=\"border: 1.5px solid #9aa9b7; border-radius: 10px; padding: 12px; min-height: 48px\"><\u002Flabel>\n<div class=\"g2\" style=\"gap: 16px\">\n<label for=\"f-pueblo\" style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600\">Localidad<sc-raw-select id=\"f-pueblo\" name=\"localidad\" style=\"border: 1.5px solid #9aa9b7; border-radius: 10px; padding: 12px; min-height: 48px; background: #ffffff\"><option>Jávea / Xàbia<\u002Foption><option>Dénia<\u002Foption><option>Otra de la Marina Alta<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n<label for=\"f-tipo\" style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600\">Trabajo<sc-raw-select id=\"f-tipo\" name=\"trabajo\" style=\"border: 1.5px solid #9aa9b7; border-radius: 10px; padding: 12px; min-height: 48px; background: #ffffff\"><option>Interior<\u002Foption><option>Fachada / exterior<\u002Foption><option>Rejas y carpintería<\u002Foption><option>Varios<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n<\u002Fdiv>\n<label for=\"f-msg\" style=\"display: flex; flex-direction: column; gap: 6px; font-weight: 600\">Qué quieres pintar<textarea id=\"f-msg\" name=\"mensaje\" rows=\"4\" placeholder=\"Ej.: salón y dos dormitorios, unos 80 m², quitar gotelé\" style=\"border: 1.5px solid #9aa9b7; border-radius: 10px; padding: 12px; resize: vertical\"><\u002Ftextarea><\u002Flabel>\n<button type=\"submit\" style=\"background: #1b5fa6; color: #ffffff; font: 800 17px Archivo, system-ui, sans-serif; border: 0; border-radius: 999px; padding: 14px 24px; min-height: 52px; cursor: pointer\">Enviar solicitud<\u002Fbutton>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #123f70; color: #e3eefa; padding: 28px max(5vw, 16px); font-size: 15px\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: space-between\">\n<span><strong style=\"color: #ffffff\">Ramiro Cuevas<\u002Fstrong>, pintor en Jávea, Dénia y la Marina Alta<\u002Fspan>\n<span>[TELÉFONO] · [CORREO ELECTRÓNICO]<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4300}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { shutter: 0, sent: false };\n  }\n  renderVals() {\n    const colors = [\n      { name: 'Azul Mediterráneo', hex: '#1f5fa8' },\n      { name: 'Verde carrubo', hex: '#4d6b3a' },\n      { name: 'Ocre albero', hex: '#c99a3b' },\n      { name: 'Granate', hex: '#8a2b2b' },\n      { name: 'Gris Montgó', hex: '#6b7078' }\n    ];\n    const cur = colors[this.state.shutter] || colors[0];\n    const swatches = colors.map((c, i) => {\n      const on = i === this.state.shutter;\n      return {\n        name: c.name,\n        on: on ? 'true' : 'false',\n        style: 'width: 44px; height: 44px; border-radius: 50%; cursor: pointer; background: ' + c.hex + '; border: 3px solid #ffffff; box-shadow: 0 0 0 ' + (on ? '3px #14212e' : '1px #9aa9b7'),\n        pick: () => this.setState({ shutter: i })\n      };\n    });\n    const services = [\n      { title: 'Interiores', text: 'Salones, dormitorios, cocinas y baños. Paredes y techos con acabado liso y uniforme.', icon: 'M3 21V9l9-6 9 6v12M9 21v-6h6v6' },\n      { title: 'Fachadas y exteriores', text: 'Chalets y casas de campo: limpieza, reparación de grietas y pintura de exterior.', icon: 'M2 21h20M4 21V10h16v11M8 14h3v3H8zM13 14h3v7h-3M7 10V6h10v4' },\n      { title: 'Quitar gotelé', text: 'Alisado de paredes con gotelé para un acabado moderno y liso antes de pintar.', icon: 'M4 4h16v16H4zM8 8h.01M12 9h.01M16 8h.01M9 13h.01M15 13h.01M12 16h.01' },\n      { title: 'Rejas y barandillas', text: 'Tratamiento del óxido y esmalte protector para hierro expuesto al salitre.', icon: 'M4 3v18M9 3v18M14 3v18M19 3v18M2 7h20M2 17h20' },\n      { title: 'Puertas y carpintería', text: 'Lijado y esmaltado de puertas, contraventanas, pérgolas y madera de exterior.', icon: 'M6 21V3h12v18M10 12h.01M3 21h18' },\n      { title: 'Terrazas y muros', text: 'Pintura de muros de parcela, porches, terrazas y zonas de piscina.', icon: 'M2 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0M4 14V6h16v8M8 6v8M16 6v8' }\n    ];\n    const steps = [\n      { n: '1', title: 'Visita', text: 'Voy a tu casa, vemos juntos lo que quieres pintar y el estado de las superficies.' },\n      { n: '2', title: 'Presupuesto', text: 'Te paso un presupuesto por escrito, detallado y sin compromiso.' },\n      { n: '3', title: 'Trabajo limpio', text: 'Protejo suelos y muebles, preparo bien las paredes y pinto con cuidado.' },\n      { n: '4', title: 'Entrega', text: 'Recojo, limpio y repasamos juntos el resultado antes de terminar.' }\n    ];\n    return {\n      shutter: cur.hex,\n      shutterName: cur.name,\n      swatches,\n      services,\n      steps,\n      towns: ['Pedreguer', 'Gata de Gorgos', 'Ondara', 'El Verger', 'Benitachell', 'Teulada-Moraira', 'Els Poblets'],\n      sent: this.state.sent,\n      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
