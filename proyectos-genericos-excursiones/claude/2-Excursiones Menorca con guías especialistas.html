Excursiones<\u002Fa>\n<a href=\"#guias\">Guías<\u002Fa>\n<a href=\"#como-funciona\">Cómo funciona<\u002Fa>\n<a href=\"#contacto\">Contacto<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<!-- Portada -->\n<section id=\"inicio\" style=\"background:#11282E;color:#F0EFE9;overflow:hidden\">\n<div style=\"max-width:1280px;margin:0 auto;padding:72px 40px 0;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-end;justify-content:space-between\">\n<div style=\"flex:1 1 520px;min-width:0;padding-bottom:72px\">\n<p style=\"margin:0 0 20px;font-size:14px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#7FD1CF\">Menorca · Reserva de la Biosfera · Menorca Talayótica, Patrimonio Mundial<\u002Fp>\n<h1 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:clamp(40px,6vw,76px);line-height:1.04;text-wrap:balance\">Menorca se entiende mejor con quien la estudia<\u002Fh1>\n<p style=\"margin:28px 0 0;font-size:20px;max-width:560px;color:#D5DCD9\">Excursiones en grupo reducido guiadas por una arqueóloga y un profesor de historia del arte. Piedra, arquitectura y paisaje, contados por quienes los conocen a fondo.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:36px\">\n<a class=\"btn\" href=\"#excursiones\" style=\"background:#0E6E73;color:#fff;padding:16px 28px;font-weight:600;border-radius:2px;min-height:48px;box-sizing:border-box\">Ver excursiones<\u002Fa>\n<a href=\"#guias\" style=\"border:1.5px solid #7FD1CF;color:#F0EFE9;padding:15px 28px;font-weight:600;border-radius:2px;min-height:48px;box-sizing:border-box\">Conocer a los guías<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:0 1 460px;min-width:0;display:flex;justify-content:center;align-items:flex-end\">\n<svg sc-camel-view-box=\"0 0 460 360\" width=\"100%\" style=\"max-width:460px;display:block\" role=\"img\" aria-label=\"Silueta de una naveta, construcción funeraria talayótica con forma de barco invertido\">\n<rect x=\"0\" y=\"330\" width=\"460\" height=\"30\" fill=\"#1B3A42\"><\u002Frect>\n<path d=\"M40 330 L70 120 Q230 40 400 120 L420 330 Z\" fill=\"#C9C6B8\"><\u002Fpath>\n<g stroke=\"#11282E\" stroke-width=\"3\" fill=\"none\" opacity=\"0.55\">\n<path d=\"M46 290 H414\"><\u002Fpath><path d=\"M52 250 H410\"><\u002Fpath><path d=\"M58 210 H406\"><\u002Fpath><path d=\"M64 170 H402\"><\u002Fpath><path d=\"M76 130 H394\"><\u002Fpath>\n<path d=\"M120 290 V250 M300 290 V250 M200 250 V210 M360 250 V210 M150 210 V170 M260 210 V170 M210 170 V130 M330 170 V130\"><\u002Fpath>\n<\u002Fg>\n<rect x=\"190\" y=\"262\" width=\"60\" height=\"68\" fill=\"#11282E\"><\u002Frect>\n<rect x=\"180\" y=\"250\" width=\"80\" height=\"14\" fill=\"#A9A698\"><\u002Frect>\n<\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Datos -->\n<section style=\"background:#E3E1D8;border-bottom:1px solid #CFCCBF\">\n<div style=\"max-width:1280px;margin:0 auto;padding:28px 40px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:20px 56px;justify-content:space-between;font-size:16px\">\n<p style=\"margin:0\"><strong style=\"font-family:'Gloock',Georgia,serif;font-size:28px;display:block;line-height:1.1\">Máx. 10<\u002Fstrong>personas por grupo<\u002Fp>\n<p style=\"margin:0\"><strong style=\"font-family:'Gloock',Georgia,serif;font-size:28px;display:block;line-height:1.1\">2 especialidades<\u002Fstrong>arqueología e historia del arte<\u002Fp>\n<p style=\"margin:0\"><strong style=\"font-family:'Gloock',Georgia,serif;font-size:28px;display:block;line-height:1.1\">ES · EN · CA<\u002Fstrong>idiomas de las visitas<\u002Fp>\n<p style=\"margin:0\"><strong style=\"font-family:'Gloock',Georgia,serif;font-size:28px;display:block;line-height:1.1\">Transporte incluido<\u002Fstrong>minibús desde tu alojamiento<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Excursiones -->\n<section id=\"excursiones\" style=\"max-width:1280px;margin:0 auto;padding:96px 40px 24px;box-sizing:border-box\">\n<h2 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:clamp(32px,4vw,48px);line-height:1.1;text-wrap:balance\">Cinco excursiones, dos formas de mirar la isla<\u002Fh2>\n<p style=\"margin:16px 0 48px;max-width:640px;color:#3C5359\">Cada ruta la lleva el guía cuya especialidad mejor la explica. Duraciones aproximadas; salimos de Mahón, Ciutadella y los principales alojamientos.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:28px\">\n\n<article style=\"background:#fff;border-top:6px solid #0E6E73;padding:32px;display:flex;flex-direction:column;gap:14px\">\n<p style=\"margin:0;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#0E6E73\">Arqueología · Día completo · 7 h<\u002Fp>\n<h3 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:30px;line-height:1.15\">La Menorca talayótica<\u002Fh3>\n<p style=\"margin:0;color:#2B4046\">Naveta des Tudons, Torre d'en Galmés y Trepucó. Cómo vivía, enterraba y levantaba piedra una sociedad de la Edad del Bronce y del Hierro, y por qué su conjunto es hoy Patrimonio Mundial.<\u002Fp>\n<p style=\"margin:auto 0 0;padding-top:12px;font-weight:600\">Con la arqueóloga · [PRECIO] € por persona<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background:#fff;border-top:6px solid #11282E;padding:32px;display:flex;flex-direction:column;gap:14px\">\n<p style=\"margin:0;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#0E6E73\">Historia del arte · Media jornada · 4 h<\u002Fp>\n<h3 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:30px;line-height:1.15\">Ciutadella, de la Edad Media al barroco<\u002Fh3>\n<p style=\"margin:0;color:#2B4046\">Catedral gótica, palacios señoriales, el puerto y el mercado. Una lectura de la arquitectura de la antigua capital, de sus reformas y de quienes las pagaron.<\u002Fp>\n<p style=\"margin:auto 0 0;padding-top:12px;font-weight:600\">Con el profesor de historia del arte · [PRECIO] € por persona<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background:#fff;border-top:6px solid #11282E;padding:32px;display:flex;flex-direction:column;gap:14px\">\n<p style=\"margin:0;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#0E6E73\">Historia del arte · Media jornada · 4 h<\u002Fp>\n<h3 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:30px;line-height:1.15\">Mahón y la huella británica<\u002Fh3>\n<p style=\"margin:0;color:#2B4046\">Fachadas georgianas, el puerto natural, la isla del Rey y el Museo de Menorca. Cómo un siglo de dominio inglés dejó su estilo en una ciudad mediterránea.<\u002Fp>\n<p style=\"margin:auto 0 0;padding-top:12px;font-weight:600\">Con el profesor de historia del arte · [PRECIO] € por persona<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background:#fff;border-top:6px solid #0E6E73;padding:32px;display:flex;flex-direction:column;gap:14px\">\n<p style=\"margin:0;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#0E6E73\">Arqueología · Media jornada · 5 h a pie<\u002Fp>\n<h3 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:30px;line-height:1.15\">Camí de Cavalls y cuevas funerarias<\u002Fh3>\n<p style=\"margin:0;color:#2B4046\">Un tramo del antiguo camino de ronda hasta una necrópolis excavada en los acantilados. Paisaje, geología y prehistoria en una caminata de dificultad baja.<\u002Fp>\n<p style=\"margin:auto 0 0;padding-top:12px;font-weight:600\">Con la arqueóloga · [PRECIO] € por persona<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background:#0E6E73;color:#fff;padding:32px;display:flex;flex-direction:column;gap:14px;grid-column:1 / -1\">\n<p style=\"margin:0;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#CDEFEE\">Dos guías · Día completo · 8 h<\u002Fp>\n<h3 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:34px;line-height:1.15\">De la piedra al cuadro: tres mil años en un día<\u002Fh3>\n<p style=\"margin:0;max-width:760px\">Por la mañana, un yacimiento talayótico con la arqueóloga. Por la tarde, una ciudad histórica con el profesor de historia del arte. Una sola jornada para ver cómo cambia lo que una sociedad construye y por qué.<\u002Fp>\n<p style=\"margin:0;padding-top:8px;font-weight:600\">[PRECIO] € por persona · almuerzo incluido<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Guías -->\n<section id=\"guias\" style=\"background:#11282E;color:#F0EFE9;margin-top:72px\">\n<div style=\"max-width:1280px;margin:0 auto;padding:96px 40px;box-sizing:border-box\">\n<h2 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:clamp(32px,4vw,48px);line-height:1.1\">Tus guías<\u002Fh2>\n<p style=\"margin:16px 0 56px;max-width:620px;color:#D5DCD9\">Profesionales con formación y trabajo en su disciplina, no solo guías con un guion aprendido.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:56px 64px\">\n\n<div style=\"flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n<div style=\"width:100%;aspect-ratio:4/3;background:#1B3A42;border:1.5px dashed #7FD1CF;display:flex;align-items:center;justify-content:center;color:#7FD1CF;font-size:15px;text-align:center;padding:16px;box-sizing:border-box\">[FOTO DE LA ARQUEÓLOGA]<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:34px\">[Nombre y apellidos]<\u002Fh3>\n<p style=\"margin:0;font-size:14px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#7FD1CF\">Arqueóloga<\u002Fp>\n<p style=\"margin:0;color:#D5DCD9\">[Formación, años de campo y yacimientos en los que ha trabajado. Ejemplo: licenciada en Historia, especializada en prehistoria de las Baleares, con campañas de excavación en yacimientos talayóticos.]<\u002Fp>\n<p style=\"margin:0;color:#D5DCD9\"><strong style=\"color:#F0EFE9\">Te enseña a leer el terreno:<\u002Fstrong> cómo reconocer un talayot, una taula o un recinto de cabañas, y qué dicen los restos sobre quienes los levantaron.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:20px\">\n<div style=\"width:100%;aspect-ratio:4/3;background:#1B3A42;border:1.5px dashed #7FD1CF;display:flex;align-items:center;justify-content:center;color:#7FD1CF;font-size:15px;text-align:center;padding:16px;box-sizing:border-box\">[FOTO DEL PROFESOR]<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:34px\">[Nombre y apellidos]<\u002Fh3>\n<p style=\"margin:0;font-size:14px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#7FD1CF\">Profesor de historia del arte<\u002Fp>\n<p style=\"margin:0;color:#D5DCD9\">[Formación, centro donde da clase y líneas de investigación. Ejemplo: doctor en Historia del Arte, profesor de arquitectura y patrimonio mediterráneos.]<\u002Fp>\n<p style=\"margin:0;color:#D5DCD9\"><strong style=\"color:#F0EFE9\">Te enseña a leer la fachada:<\u002Fstrong> estilos, reformas, encargos y las influencias francesas, inglesas y catalanas que se cruzan en la isla.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Cómo funciona -->\n<section id=\"como-funciona\" style=\"max-width:1280px;margin:0 auto;padding:96px 40px;box-sizing:border-box\">\n<h2 style=\"margin:0 0 48px;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:clamp(32px,4vw,48px);line-height:1.1\">Cómo funciona<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:36px\">\n<div style=\"border-top:2px solid #11282E;padding-top:20px\">\n<h3 style=\"margin:0 0 10px;font-size:20px;font-weight:700\">1. Eliges la excursión<\u002Fh3>\n<p style=\"margin:0;color:#3C5359\">Escríbenos con la fecha y el número de personas. Te confirmamos disponibilidad en un día laborable.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top:2px solid #11282E;padding-top:20px\">\n<h3 style=\"margin:0 0 10px;font-size:20px;font-weight:700\">2. Te recogemos<\u002Fh3>\n<p style=\"margin:0;color:#3C5359\">Minibús desde tu hotel o apartamento en los puntos de salida de Mahón, Ciutadella y la costa.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top:2px solid #11282E;padding-top:20px\">\n<h3 style=\"margin:0 0 10px;font-size:20px;font-weight:700\">3. Ves y entiendes<\u002Fh3>\n<p style=\"margin:0;color:#3C5359\">Grupos de hasta 10 personas. Entradas a los monumentos y agua incluidas. Calzado cómodo y gorra en las rutas de campo.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top:2px solid #11282E;padding-top:20px\">\n<h3 style=\"margin:0 0 10px;font-size:20px;font-weight:700\">4. Sin sorpresas<\u002Fh3>\n<p style=\"margin:0;color:#3C5359\">Si el tiempo impide la ruta, la cambiamos por otra de la misma especialidad o te devolvemos el importe. [Ajustar a vuestra política]<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Contacto -->\n<section id=\"contacto\" style=\"background:#E3E1D8\">\n<div style=\"max-width:1280px;margin:0 auto;padding:80px 40px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:40px 80px;align-items:flex-start;justify-content:space-between\">\n<div style=\"flex:1 1 420px;min-width:0\">\n<h2 style=\"margin:0;font-family:'Gloock',Georgia,serif;font-weight:400;font-size:clamp(32px,4vw,48px);line-height:1.1;text-wrap:balance\">Reserva tu excursión<\u002Fh2>\n<p style=\"margin:16px 0 0;max-width:480px;color:#3C5359\">Cuéntanos qué excursión te interesa, la fecha y cuántos sois. Respondemos en 24 horas.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:18px;font-size:18px\">\n<p style=\"margin:0\"><strong style=\"display:block;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#0E6E73\">Correo<\u002Fstrong>[EMAIL@TUEMPRESA.COM]<\u002Fp>\n<p style=\"margin:0\"><strong style=\"display:block;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#0E6E73\">Teléfono y WhatsApp<\u002Fstrong>[+34 000 000 000]<\u002Fp>\n<p style=\"margin:0\"><strong style=\"display:block;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#0E6E73\">Oficina<\u002Fstrong>[Dirección, Mahón]<\u002Fp>\n<a class=\"btn\" href=\"#inicio\" style=\"align-self:flex-start;background:#0E6E73;color:#fff;padding:16px 28px;font-weight:600;border-radius:2px;min-height:48px;box-sizing:border-box;margin-top:8px\">Volver arriba<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:#11282E;color:#B9C5C3;padding:28px 40px;font-size:14px;text-align:center\">\nTalaiot Excursiones · Menorca · [Nº de registro de turismo] · [Aviso legal y privacidad]\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4700}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
