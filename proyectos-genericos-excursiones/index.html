<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Índice de las webs genéricas de excursiones.">
    <meta name="theme-color" content="#f4efe4">
    <title>Excursiones genéricas | Índice</title>
    <style>
      :root {
        --fondo: #f4efe4;
        --papel: #fffdf7;
        --grafito: #262823;
        --oliva: #66703d;
        --linea: #c9c1ae;
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-family: Arial, sans-serif;
        color: var(--grafito);
        background: var(--fondo);
      }

      body {
        margin: 0;
      }

      .salto {
        position: fixed;
        top: 0;
        left: 0.75rem;
        z-index: 10;
        min-height: 44px;
        padding: 0.75rem 1rem;
        background: var(--grafito);
        color: white;
        transform: translateY(-150%);
      }

      .salto:focus {
        transform: translateY(0);
      }

      header,
      main,
      footer {
        width: min(64rem, calc(100% - 2rem));
        margin-inline: auto;
      }

      header {
        min-height: 6rem;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--linea);
      }

      main {
        padding-block: 3rem 5rem;
      }

      h1,
      h2 {
        font-family: Georgia, serif;
      }

      h1 {
        margin: 0.25rem 0 1.25rem;
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1;
      }

      h2 {
        margin: 3.5rem 0 1.25rem;
        padding-top: 1.25rem;
        border-top: 3px solid var(--oliva);
        font-size: clamp(1.75rem, 5vw, 2.25rem);
      }

      .registro {
        margin: 0;
        color: var(--oliva);
        font-family: monospace;
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      ul {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a.enlace {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border: 1px solid var(--linea);
        background: var(--papel);
        color: var(--grafito);
        text-decoration: none;
      }

      a.enlace::after {
        content: "↗";
        color: var(--oliva);
        font-size: 1.25rem;
      }

      a.enlace:hover {
        border-color: var(--oliva);
        background: white;
      }

      a.enlace:focus-visible {
        outline: 3px solid var(--oliva);
        outline-offset: 3px;
      }

      footer {
        min-height: 5rem;
        display: flex;
        align-items: center;
        border-top: 1px solid var(--linea);
        font-size: 0.875rem;
      }

      @media (min-width: 48rem) {
        ul {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        a.enlace {
          min-height: 5.25rem;
        }
      }
    </style>
  </head>
  <body>
    <a class="salto" href="#contenido">Saltar al contenido</a>

    <header>
      <p class="registro">Excursiones · Índice</p>
    </header>

    <main id="contenido" tabindex="-1">
      <h1>Webs genéricas de excursiones</h1>

      <section aria-labelledby="gpt">
        <h2 id="gpt">GPT</h2>
        <ul>
          <li>
            <a class="enlace" href="gpt/1-excursiones-generico.html">
              Menorca a tu Ritmo
            </a>
          </li>
          <li>
            <a class="enlace" href="gpt/2-menorca-experiencias.html">
              Menorca con Historia
            </a>
          </li>
        </ul>
      </section>

      <section aria-labelledby="gemini">
        <h2 id="gemini">Gemini</h2>
        <ul>
          <li>
            <a class="enlace" href="gemini/1-menorca_viva_excursiones_y_experiencias.html">
              Menorca Viva
            </a>
          </li>
          <li>
            <a class="enlace" href="gemini/2-talayot_arte_excursiones_culturales_en_menorca.html">
              Talayot &amp; Arte
            </a>
          </li>
        </ul>
      </section>

      <section aria-labelledby="claude">
        <h2 id="claude">Claude</h2>
        <ul>
          <li>
            <a class="enlace" href="claude/1-Excursiones Menorca.html">
              Migjorn Excursiones
            </a>
          </li>
          <li>
            <a class="enlace" href="claude/2-Excursiones Menorca con guías especialistas.html">
              Talaiot Excursiones
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer>
      <p>Proyectos genéricos · Excursiones</p>
    </footer>
  </body>
</html>
